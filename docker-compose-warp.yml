services:
  warp-socks:
    image: caomingjun/warp
    container_name: warp-socks
    restart: always
    mem_limit: 128m
    mem_swap_limit: 128m
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "11081:1080"
    environment:
      - GOST_ARGS=-L socks5://${WARP_SOCKS_USER}:${WARP_SOCKS_PASS}@:1080