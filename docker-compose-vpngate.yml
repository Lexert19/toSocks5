services:
  vpngate-socks:
    image: mocasus/vpnx:latest
    container_name: vpngate-socks
    restart: unless-stopped
    mem_limit: 128m
    mem_swap_limit: 128m
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "11080:1080"
    environment:
      - API_TOKEN=${VPNX_API_TOKEN}
      - SOCKS_USER=${VPNX_SOCKS_USER}
      - SOCKS_PASS=${VPNX_SOCKS_PASS}